<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kychen｜名片</title>
<meta name="description" content="Kychen 的聯絡方式與名片資訊">
<meta property="og:title" content="Kychen｜名片">
<meta property="og:description" content="聯絡方式與名片資訊">
<meta property="og:type" content="profile">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23c8402a'/%3E%3Ctext x='32' y='45' font-size='38' font-family='Georgia,serif' font-weight='700' text-anchor='middle' fill='%23fff'%3EK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ea;
    --card: #fffdf8;
    --ink: #16181d;
    --muted: #6b6a66;
    --line: #e2ddd2;
    --seal: #c8402a;
    --seal-ink: #fffdf8;
    --hover: #f0ebe0;
    --shadow: 0 1px 2px rgba(22, 24, 29, .06), 0 18px 40px -18px rgba(22, 24, 29, .28);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card: #1c1f25;
      --ink: #ece8df;
      --muted: #9a978f;
      --line: #2c3038;
      --seal: #e0553d;
      --seal-ink: #14161a;
      --hover: #242830;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 18px 40px -18px rgba(0, 0, 0, .7);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    line-height: 1.6;
    display: grid;
    place-items: center;
    padding: 32px 16px 48px;
  }
  main { width: 100%; max-width: 460px; }

  /* ── 名片本體 ─────────────────────────── */
  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 28px 28px 24px;
    aspect-ratio: 90 / 54;           /* 標準名片比例 */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }
  .card::after {                      /* 右下角的細格線裝飾 */
    content: "";
    position: absolute;
    right: -40px; bottom: -40px;
    width: 180px; height: 180px;
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 18px 18px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 18px 18px;
    -webkit-mask-image: radial-gradient(circle at 100% 100%, #000 0, transparent 70%);
            mask-image: radial-gradient(circle at 100% 100%, #000 0, transparent 70%);
    pointer-events: none;
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .seal {
    flex: none;
    width: 46px; height: 46px;
    border-radius: 8px;
    background: var(--seal);
    color: var(--seal-ink);
    display: grid; place-items: center;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: 26px;
    line-height: 1;
    transform: rotate(-4deg);
  }
  .org {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: right;
    padding-top: 4px;
  }
  h1 {
    margin: 0;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: clamp(34px, 10vw, 46px);
    line-height: 1.05;
    letter-spacing: -.01em;
  }
  .native { margin: 4px 0 0; font-size: 15px; font-weight: 500; letter-spacing: .12em; }
  .role { margin: 10px 0 0; font-size: 14px; color: var(--muted); }

  /* ── 聯絡方式列表 ─────────────────────── */
  .contacts { list-style: none; margin: 20px 0 0; padding: 0; }
  .contacts li + li { margin-top: 8px; }
  .row {
    display: flex; align-items: center; gap: 14px;
    width: 100%;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: inherit;
    text-decoration: none;
    transition: background .15s, border-color .15s, transform .15s;
  }
  .row:hover { background: var(--hover); border-color: var(--muted); transform: translateY(-1px); }
  .row:focus-visible, button:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
  .row svg { flex: none; width: 20px; height: 20px; color: var(--seal); }
  .row .text { min-width: 0; flex: 1; }
  .row .label {
    display: block;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted);
  }
  .row .value { display: block; font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
  .row .arrow { flex: none; color: var(--muted); font-size: 14px; }

  /* ── 動作按鈕 ─────────────────────────── */
  .actions { display: flex; gap: 8px; margin-top: 16px; }
  button {
    flex: 1;
    font: inherit; font-size: 14px; font-weight: 500;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--bg);
    cursor: pointer;
    transition: opacity .15s;
  }
  button:hover { opacity: .85; }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button.ghost:hover { background: var(--hover); opacity: 1; }

  footer {
    margin-top: 28px;
    text-align: center;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--muted);
  }
  @media (max-width: 380px) {
    .card { padding: 22px 20px 20px; }
    .actions { flex-direction: column; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media print {
    body { background: #fff; padding: 0; }
    .actions, footer { display: none; }
    .card { box-shadow: none; }
  }
</style>
</head>
<body>
<main>
  <section class="card" aria-label="名片">
    <div class="card-top">
      <div class="seal" id="seal" aria-hidden="true"></div>
      <div class="org" id="org"></div>
    </div>
    <div>
      <h1 id="name"></h1>
      <p class="native" id="native"></p>
      <p class="role" id="role"></p>
    </div>
  </section>

  <ul class="contacts" id="contacts"></ul>

  <div class="actions">
    <button id="save" type="button">儲存聯絡人 (.vcf)</button>
    <button id="share" type="button" class="ghost">複製此頁連結</button>
  </div>

  <footer id="footer"></footer>
</main>

<script>
/* ════════════════════════════════════════════════════════════
   名片資料：只要改這一段就好。
   不想顯示的欄位留空字串 ""，該列會自動隱藏。
   ════════════════════════════════════════════════════════════ */
const CARD = {
  name:     "Kychen",                 // 主要顯示名稱
  native:   "",                       // 中文姓名（選填）
  role:     "你的職稱／一句話介紹",      // 例：遊戲程式設計師
  org:      "",                       // 右上角小字：學校或單位（選填）
  email:    "your@email.com",
  phone:    "",                       // 例：+886 912 345 678
  github:   "bbkuan",                 // 只填帳號
  linkedin: "",                       // 只填帳號（linkedin.com/in/ 後面那段）
  website:  "",                       // 完整網址
  line:     "",                       // LINE ID
  location: ""                        // 例：Taipei, Taiwan
};
/* ════════════════════════════════════════════════════════════ */

const ICONS = {
  email:    '<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/>',
  phone:    '<path d="M6.5 3h3l1.5 4.5-2 1.5a12 12 0 0 0 6 6l1.5-2L21 14.5v3A2.5 2.5 0 0 1 18.5 20 15.5 15.5 0 0 1 4 5.5 2.5 2.5 0 0 1 6.5 3z"/>',
  github:   '<path d="M9 19c-4 1.2-4-2-6-2.5m12 5v-3.4a3 3 0 0 0-.8-2.3c2.8-.3 5.8-1.4 5.8-6.300a4.900 4.900 0 0 0-1.300-3.400 4.600 4.600 0 0 0-.1-3.400s-1.100-.3-3.500 1.300a12 12 0 0 0-6.200 0C6.500 2.400 5.400 2.700 5.400 2.700a4.600 4.600 0 0 0-.1 3.400A4.900 4.900 0 0 0 4 9.500c0 4.900 3 6 5.800 6.300a3 3 0 0 0-.8 2.300V21.500"/>',
  linkedin: '<rect x="3" y="3" width="18" height="18" rx="2.500"/><path d="M7.500 10v7m0-10v.01M11.500 17v-4a2.500 2.500 0 0 1 5 0v4m-5-7v7"/>',
  website:  '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/>',
  line:     '<path d="M12 4c5 0 9 3.100 9 7s-4 7-9 7c-.6 0-1.200 0-1.800-.1L6 20.500l.6-3.400C4.400 15.800 3 13.600 3 11c0-3.900 4-7 9-7z"/>',
  location: '<path d="M12 21s7-6.100 7-11.500a7 7 0 0 0-14 0C5 14.900 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/>'
};

const ROWS = [
  { key: "email",    label: "Email",    href: v => "mailto:" + v },
  { key: "phone",    label: "電話",      href: v => "tel:" + v.replace(/[^\d+]/g, "") },
  { key: "github",   label: "GitHub",   href: v => "https://github.com/" + v,          show: v => "github.com/" + v },
  { key: "linkedin", label: "LinkedIn", href: v => "https://www.linkedin.com/in/" + v, show: v => "linkedin.com/in/" + v },
  { key: "website",  label: "網站",      href: v => v,                                  show: v => v.replace(/^https?:\/\//, "").replace(/\/$/, "") },
  { key: "line",     label: "LINE",     href: v => "https://line.me/ti/p/~" + encodeURIComponent(v) },
  { key: "location", label: "所在地",    href: null }
];

const $ = id => document.getElementById(id);
const setText = (id, value) => { const el = $(id); el.textContent = value || ""; el.hidden = !value; };

setText("name", CARD.name);
setText("native", CARD.native);
setText("role", CARD.role);
setText("org", CARD.org);
$("seal").textContent = (CARD.name || "?").trim().charAt(0).toUpperCase();
document.title = (CARD.name || "名片") + "｜名片";
$("footer").textContent = "© " + new Date().getFullYear() + " " + (CARD.name || "");

const list = $("contacts");
for (const row of ROWS) {
  const value = (CARD[row.key] || "").trim();
  if (!value) continue;
  const li = document.createElement("li");
  const el = document.createElement(row.href ? "a" : "div");
  el.className = "row";
  if (row.href) {
    el.href = row.href(value);
    if (/^https?:/.test(el.href)) { el.target = "_blank"; el.rel = "noopener me"; }
  }
  el.innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    ICONS[row.key] + '</svg><span class="text"><span class="label"></span><span class="value"></span></span>' +
    (row.href ? '<span class="arrow" aria-hidden="true">↗</span>' : "");
  el.querySelector(".label").textContent = row.label;
  el.querySelector(".value").textContent = row.show ? row.show(value) : value;
  li.appendChild(el);
  list.appendChild(li);
}

/* 產生 vCard，讓手機可以一鍵存進通訊錄 */
function buildVCard() {
  const esc = s => String(s).replace(/([\\;,])/g, "\\$1").replace(/\n/g, "\\n");
  const lines = ["BEGIN:VCARD", "VERSION:3.0"];
  const full = CARD.native ? CARD.native + " (" + CARD.name + ")" : CARD.name;
  lines.push("FN:" + esc(full), "N:" + esc(full) + ";;;;");
  if (CARD.role)     lines.push("TITLE:" + esc(CARD.role));
  if (CARD.org)      lines.push("ORG:" + esc(CARD.org));
  if (CARD.email)    lines.push("EMAIL;TYPE=INTERNET:" + esc(CARD.email));
  if (CARD.phone)    lines.push("TEL;TYPE=CELL:" + esc(CARD.phone));
  if (CARD.location) lines.push("ADR;TYPE=WORK:;;" + esc(CARD.location) + ";;;;");
  if (CARD.website)  lines.push("URL:" + CARD.website);
  if (CARD.github)   lines.push("URL:https://github.com/" + CARD.github);
  if (CARD.linkedin) lines.push("URL:https://www.linkedin.com/in/" + CARD.linkedin);
  if (CARD.line)     lines.push("NOTE:LINE ID: " + esc(CARD.line));
  lines.push("END:VCARD");
  return lines.join("\r\n");
}

$("save").addEventListener("click", () => {
  const blob = new Blob([buildVCard()], { type: "text/vcard;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (CARD.name || "contact") + ".vcf";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

$("share").addEventListener("click", async e => {
  const btn = e.currentTarget, original = btn.textContent;
  try {
    await navigator.clipboard.writeText(location.href);
    btn.textContent = "已複製 ✓";
  } catch {
    btn.textContent = "複製失敗，請手動複製網址";
  }
  setTimeout(() => { btn.textContent = original; }, 1800);
});
</script>
</body>
</html>
