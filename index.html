<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>陳冠宇 Kuanyu Chen</title>
<meta name="description" content="陳冠宇 Kuanyu Chen — Game Production · Live-Ops Strategy · Agentic AI Consulting">
<meta property="og:title" content="陳冠宇 Kuanyu Chen">
<meta property="og:description" content="Game Production · Live-Ops Strategy · Agentic AI Consulting">
<meta property="og:type" content="profile">
<meta name="theme-color" content="#ebe9e3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%2317191e'/%3E%3Crect x='14' y='44' width='14' height='3' fill='%235b7fb0'/%3E%3Ctext x='14' y='38' font-size='24' font-family='Arial,sans-serif' font-weight='700' letter-spacing='1' fill='%23faf8f2'%3EKC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* 配色對齊實體名片：正面米白紙＋深藍細線，背面深炭灰 */
  :root {
    --bg: #ebe9e3;
    --card: #faf8f2;
    --ink: #16181d;
    --muted: #6b6a66;
    --line: #e3dfd4;
    --accent: #1f3a5f;
    --hover: #f2efe6;
    --back: #17191e;
    --back-ink: #f4f2ec;
    --back-muted: #8d8f96;
    --back-line: #3a3d45;
    --shadow: 0 1px 2px rgba(22, 24, 29, .06), 0 14px 32px -18px rgba(22, 24, 29, .35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0f12;
      --card: #17191e;
      --ink: #ece9e1;
      --muted: #94938d;
      --line: #2c2f37;
      --accent: #8fb0d9;
      --hover: #1e2127;
      --back: #faf8f2;
      --back-ink: #16181d;
      --back-muted: #6b6a66;
      --back-line: #dcd8cd;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 14px 32px -18px rgba(0, 0, 0, .9);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    line-height: 1.55;
    padding: 16px 16px 48px;
  }
  .wrap { width: 100%; max-width: 440px; margin: 0 auto; }

  /* ── 語言切換 ─────────────────────────── */
  .topbar { display: flex; justify-content: flex-end; margin-bottom: 16px; }
  .lang {
    display: inline-flex;
    padding: 2px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--card);
  }
  .lang button {
    font: inherit; font-size: 12px; font-weight: 500; letter-spacing: .08em;
    min-width: 44px;
    padding: 4px 10px;
    border: 0; border-radius: 2px;
    background: transparent; color: var(--muted);
    cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--card); }

  /* ── 個人資訊（置中，名片式字型與深藍短線）──── */
  .profile { text-align: center; padding: 20px 0 30px; }
  .avatar {
    width: 88px; height: 88px;
    margin: 0 auto 20px;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 0 4px var(--bg), 0 0 0 5px var(--line);
  }
  .avatar:empty { display: none; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  h1 {
    margin: 0;
    font-family: "Noto Sans TC", "IBM Plex Sans", sans-serif;
    font-weight: 900;
    font-size: 36px;
    line-height: 1.15;
    letter-spacing: .08em;
    padding-left: .08em; /* 抵銷字距造成的置中偏移 */
  }
  h1:lang(en) { font-family: "IBM Plex Sans", sans-serif; font-weight: 600; font-size: 32px; letter-spacing: .01em; padding-left: 0; }
  .alt-name {
    margin: 8px 0 0;
    font-size: 12px; font-weight: 500;
    letter-spacing: .24em;
    padding-left: .24em;
    text-transform: uppercase;
  }
  .alt-name.cjk { font-family: "Noto Sans TC", sans-serif; font-size: 14px; letter-spacing: .16em; padding-left: .16em; }
  .rule { width: 28px; height: 2px; margin: 16px auto 14px; background: var(--accent); }
  .tagline {
    margin: 0;
    font-size: 13px; color: var(--ink); opacity: .85;
    display: flex; flex-wrap: wrap; justify-content: center;
  }
  .tagline span { white-space: nowrap; }
  .tagline span:not(:last-child)::after { content: " · "; white-space: pre; color: var(--muted); }

  /* ── 連結按鈕（Linktree 式，名片紙感）──────── */
  .links { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .link {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%;
    min-height: 64px;
    padding: 10px 52px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: var(--shadow);
    color: inherit; text-align: center;
    font: inherit;
    cursor: pointer;
    transition: transform .15s, border-color .15s;
  }
  .link:hover { transform: translateY(-2px); border-color: var(--accent); }
  .link:active { transform: translateY(0); }
  .link:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .link svg {
    position: absolute; left: 20px; top: 50%;
    width: 20px; height: 20px; margin-top: -10px;
    color: var(--accent);
  }
  .link .title {
    font-size: 11px; font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .link .sub { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
  .link.pending .sub { color: var(--muted); font-weight: 400; }

  /* ── 名片背面 ─────────────────────────── */
  .card-back {
    display: flex; align-items: center; justify-content: center; gap: 20px;
    margin-top: 28px;
    padding: 22px 28px;
    border-radius: 4px;
    background: var(--back);
    color: var(--back-ink);
    box-shadow: var(--shadow);
  }
  .card-back .nick { margin: 0; font-family: "Noto Sans TC", sans-serif; font-size: 20px; font-weight: 700; letter-spacing: .08em; line-height: 1.3; }
  .card-back .en { margin: 4px 0 0; font-size: 11px; font-weight: 500; letter-spacing: .24em; color: var(--back-muted); }
  .card-back .divider { align-self: stretch; width: 1px; background: var(--back-line); }
  .card-back .copy { margin: 0; font-size: 12px; color: var(--back-muted); letter-spacing: .04em; }

  .hint { margin: 16px 0 0; text-align: center; font-size: 12px; color: var(--muted); }

  .toast {
    position: fixed; left: 50%; bottom: 28px;
    transform: translate(-50%, 20px);
    padding: 10px 18px;
    border-radius: 4px;
    background: var(--ink); color: var(--card);
    font-size: 14px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ── 外部連結二次確認 ─────────────────────── */
  .confirm {
    width: calc(100% - 32px); max-width: 320px;
    padding: 24px 22px 20px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--card); color: var(--ink);
    box-shadow: var(--shadow);
    text-align: center;
  }
  .confirm::backdrop { background: rgba(14, 15, 18, .45); }
  .confirm .c-title { margin: 0; font-family: "Noto Sans TC", "IBM Plex Sans", sans-serif; font-size: 17px; font-weight: 700; }
  .confirm .c-sub { margin: 6px 0 20px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .confirm .c-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .confirm button {
    font: inherit; font-size: 14px; font-weight: 500;
    padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 2px;
    background: transparent; color: var(--ink);
    cursor: pointer;
  }
  .confirm button.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }

  @media (max-width: 360px) {
    .card-back { padding: 20px; }
    .link { padding: 10px 44px; }
    .link svg { left: 16px; }
    h1 { font-size: 32px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media print { .topbar, .hint, .toast { display: none; } body { background: #fff; } .link, .card-back { box-shadow: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="lang" role="group" aria-label="Language / 語言">
      <button type="button" data-lang="zh" aria-pressed="true">中文</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <main>
    <section class="profile">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <h1 id="name"></h1>
      <p class="alt-name" id="altName"></p>
      <div class="rule" aria-hidden="true"></div>
      <p class="tagline" id="tagline"></p>
    </section>

    <ul class="links" id="links"></ul>

    <p class="hint" id="hint"></p>
  </main>

  <footer class="card-back">
    <div>
      <p class="nick" id="nick"></p>
      <p class="en" id="backName"></p>
    </div>
    <div class="divider" aria-hidden="true"></div>
    <p class="copy" id="footer"></p>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog class="confirm" id="confirm" aria-labelledby="confirmTitle">
  <p class="c-title" id="confirmTitle"></p>
  <p class="c-sub" id="confirmSub"></p>
  <div class="c-actions">
    <button type="button" id="confirmCancel"></button>
    <button type="button" class="primary" id="confirmOk"></button>
  </div>
</dialog>

<script>
/* ════════════════════════════════════════════════════════════
   名片資料：只要改這一段就好。
   每個按鈕點一下就會複製對應內容。留空字串 "" 的欄位會顯示「待補」，點了只會提示尚未提供。
   ════════════════════════════════════════════════════════════ */
const CARD = {
  avatar:   "",                       // 大頭照檔名（例："avatar.jpg"），留空則不顯示
  name:     { zh: "陳冠宇", en: "Kuanyu Chen" },
  nickname: "營運的冠宇",              // 名片背面的稱號
  tagline:  {
    zh: ["營運策略", "遊戲製作", "Agentic AI 顧問"],
    en: ["Game Production", "Live-Ops Strategy", "Agentic AI Consulting"]
  },
  phone:    "+886933967849",
  email:    "bee533422@gmail.com",
  line:     "bbkuan128",              // LINE ID
  wechat:   "bbkuan128",              // 微信 ID
  linkedin: "kuan-yu-chen-3948319a"   // LinkedIn 完整網址或 /in/ 後面的帳號
};

/* 介面文字（按鈕標籤與名片一致，中英文都用英文大寫） */
const I18N = {
  zh: {
    htmlLang: "zh-Hant",
    pending: "待補", hint: "點一下即可複製",
    copied: { phone: "已複製手機號碼", email: "已複製 Email", line: "已複製 LINE ID", wechat: "已複製微信 ID" },
    notYet: "此項目尚未提供", copyFailed: "複製失敗，請手動複製",
    openTitle: "前往 LinkedIn？", cancel: "取消", go: "前往"
  },
  en: {
    htmlLang: "en",
    pending: "Coming soon", hint: "Tap to copy",
    copied: { phone: "Mobile number copied", email: "Email copied", line: "LINE ID copied", wechat: "WeChat ID copied" },
    notYet: "Not available yet", copyFailed: "Couldn't copy — please copy manually",
    openTitle: "Open LinkedIn?", cancel: "Cancel", go: "Open"
  }
};
/* ════════════════════════════════════════════════════════════ */

const LABELS = { email: "Email", line: "LINE", wechat: "WeChat", phone: "Tel", linkedin: "LinkedIn" };
const ICONS = {
  phone:    '<path d="M6.5 3h3l1.5 4.5-2 1.5a12 12 0 0 0 6 6l1.5-2L21 14.5v3a2.5 2.5 0 0 1-2.5 2.5A15.5 15.5 0 0 1 4 5.5 2.5 2.5 0 0 1 6.5 3z"/>',
  email:    '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/>',
  line:     '<path d="M12 4c5 0 9 3.1 9 7s-4 7-9 7c-.6 0-1.2 0-1.8-.1L6 20.5l.6-3.4C4.4 15.8 3 13.6 3 11c0-3.9 4-7 9-7z"/><path d="M8 9.5v3h1.5M11.5 9.5v3M13.5 12.5v-3l2.5 3v-3"/>',
  wechat:   '<path d="M9.5 4C5.9 4 3 6.4 3 9.4c0 1.7.9 3.2 2.4 4.2L4.8 16l2.5-1.3c.7.2 1.4.3 2.2.3"/><path d="M21 14.6c0-2.5-2.5-4.6-5.5-4.6S10 12.1 10 14.6s2.5 4.6 5.5 4.6c.6 0 1.2-.1 1.8-.2l2.2 1.1-.5-2c1.2-.9 2-2.1 2-3.5z"/>',
  linkedin: '<rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M7.5 10.5V17M7.5 7v.01M11.5 17v-3.5a2.5 2.5 0 0 1 5 0V17M11.5 10.5V17"/>'
};

const $ = id => document.getElementById(id);
const prettyPhone = p => p.replace(/^(\+886)(\d{3})(\d{3})(\d{3})$/, "$1 $2-$3-$4");
const linkedinUrl = v => /^https?:\/\//.test(v) ? v : "https://www.linkedin.com/in/" + v.replace(/^\/+|\/+$/g, "");
const isCJK = s => /[㐀-鿿]/.test(s);

/* 每一列的定義（順序同名片）：sub 是顯示的文字，copy 是點擊後複製的內容，open 則是確認後開啟的網址；沒填的列顯示「待補」 */
function rows(t) {
  return [
    { key: "email",    sub: CARD.email,              copy: CARD.email },
    { key: "line",     sub: CARD.line,               copy: CARD.line },
    { key: "wechat",   sub: CARD.wechat,             copy: CARD.wechat },
    { key: "phone",    sub: prettyPhone(CARD.phone), copy: CARD.phone },
    { key: "linkedin", sub: CARD.linkedin && linkedinUrl(CARD.linkedin).replace(/^https?:\/\/(www\.)?linkedin\.com\//, "").replace(/\/$/, ""), open: CARD.linkedin && linkedinUrl(CARD.linkedin) }
  ].map(r => (CARD[r.key] || "").trim() ? r : { key: r.key, sub: t.pending, pending: true });
}

let lang = "zh";
let toastTimer;

function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

/* 複製到剪貼簿：優先用 Clipboard API，失敗或不支援時改用舊式做法 */
function legacyCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch {}
  ta.remove();
  return ok;
}

async function copyText(text, okMsg) {
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch {}
  if (!ok) ok = legacyCopy(text);
  toast(ok ? okMsg : I18N[lang].copyFailed);
}

/* 外部連結：先跳出確認框，按「前往」才在新分頁開啟 */
let pendingUrl = "";
function confirmOpen(url) {
  const t = I18N[lang];
  const dlg = $("confirm");
  pendingUrl = url;
  $("confirmTitle").textContent = t.openTitle;
  $("confirmSub").textContent = url.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
  $("confirmCancel").textContent = t.cancel;
  $("confirmOk").textContent = t.go;
  if (typeof dlg.showModal === "function") {
    dlg.showModal();
    $("confirmOk").focus();
  } else if (window.confirm(t.openTitle + "\n" + url)) {
    window.open(url, "_blank", "noopener");
  }
}
$("confirmOk").addEventListener("click", () => {
  window.open(pendingUrl, "_blank", "noopener");
  $("confirm").close();
});
$("confirmCancel").addEventListener("click", () => $("confirm").close());
$("confirm").addEventListener("click", e => {   // 點框外的背景也可關閉
  const r = e.currentTarget.getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) e.currentTarget.close();
});

function render() {
  const t = I18N[lang];
  const other = lang === "zh" ? "en" : "zh";
  document.documentElement.lang = t.htmlLang;
  document.title = lang === "zh"
    ? CARD.name.zh + " " + CARD.name.en
    : CARD.name.en + " " + CARD.name.zh;

  const avatar = $("avatar");
  avatar.textContent = "";
  if (CARD.avatar) {
    const img = new Image();
    img.src = CARD.avatar;
    img.alt = "";
    avatar.appendChild(img);
  }

  $("name").textContent = CARD.name[lang];
  const alt = $("altName");
  alt.textContent = CARD.name[other];
  alt.classList.toggle("cjk", isCJK(CARD.name[other]));

  const tag = $("tagline");
  tag.textContent = "";
  for (const item of CARD.tagline[lang]) {
    const s = document.createElement("span");
    s.textContent = item;
    tag.appendChild(s);
  }

  const list = $("links");
  list.textContent = "";
  for (const r of rows(t)) {
    const li = document.createElement("li");
    const el = document.createElement("button");
    el.type = "button";
    el.className = "link" + (r.pending ? " pending" : "");
    el.addEventListener("click", () => {
      if (r.pending) toast(t.notYet);          // 待補項目的暫代功能
      else if (r.open) confirmOpen(r.open);
      else copyText(r.copy, t.copied[r.key]);
    });
    el.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      ICONS[r.key] + '</svg><span class="title"></span><span class="sub"></span>';
    el.querySelector(".title").textContent = LABELS[r.key];
    el.querySelector(".sub").textContent = r.sub;
    li.appendChild(el);
    list.appendChild(li);
  }

  $("nick").textContent = CARD.nickname;
  $("backName").textContent = CARD.name.en.toUpperCase();
  $("hint").textContent = t.hint;
  $("footer").textContent = "© " + new Date().getFullYear();

  for (const b of document.querySelectorAll(".lang button")) {
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  }
}

/* 語言：網址 ?lang= 優先，其次上次選擇，最後看瀏覽器語言 */
function initialLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "zh" || q === "en") return q;
  try {
    const saved = localStorage.getItem("lang");
    if (saved === "zh" || saved === "en") return saved;
  } catch {}
  return (navigator.language || "zh").toLowerCase().startsWith("zh") ? "zh" : "en";
}

for (const b of document.querySelectorAll(".lang button")) {
  b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("lang", lang); } catch {}
    render();
  });
}

lang = initialLang();
render();
</script>
</body>
</html>
